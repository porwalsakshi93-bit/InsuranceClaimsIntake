<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Claims Intake</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header>
        <h1>Insurance Claims Intake</h1>
    </header>

    <main>
        <p class="intro">First Notice of Loss (FNOL) intake system for registering and searching insurance claims.</p>

        <div class="card-grid">
            <div class="card">
                <h2>Register a Claim</h2>
                <p>Submit a new insurance claim with a guided multi-step form.</p>
                <a href="/intake" class="btn">Start Intake</a>
            </div>
            <div class="card">
                <h2>Search Claims</h2>
                <p>Find existing claims by Claim ID or customer last name.</p>
                <a href="/search" class="btn">Search Claims</a>
            </div>
        </div>
    </main>
</body>
</html>
